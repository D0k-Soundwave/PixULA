# Cut a release.
#
# Builds the portable folder from a CLEAN checkout of one exact commit, zips
# it, and publishes it as a GitHub Release. Building here rather than
# uploading a local folder is the whole point: a working copy can be stale, or
# carry files nothing references any more, and neither is detectable by
# looking at the resulting zip.
#
# A release is simply a new APP_VERSION (js/core/constants.js) reaching main.
# Any of these starts it:
#
#   - AUTOMATIC: merge a change that bumps APP_VERSION into main. The push
#     touches js/core/constants.js, this runs, sees that v<APP_VERSION> has
#     no tag yet, and publishes it. A constants.js change that does NOT bump
#     the version finds its tag already there and stops, successfully, with
#     nothing published. This is the path Claude Code on the web uses: it
#     cannot push tags, but it can merge (.claude/skills/release/SKILL.md).
#   - Run workflow: Actions > Release > Run workflow, on main. Same as the
#     automatic path, except an existing tag is an error - asked for
#     explicitly, a release that cannot happen should say so.
#   - Push a tag: git tag v<APP_VERSION> && git push origin v<APP_VERSION>.
#
# On the first two the Publish step creates the tag itself, on the commit it
# built. That tag does not start this workflow again: GitHub never triggers a
# workflow from a ref its own token created. Runs never overlap (concurrency
# below), so an automatic run and a Run-workflow click for the same version
# cannot both publish.
#
# Every step below is a gate: a release is only published if the tag agrees
# with the app's own version and the test suite passes.
name: Release

on:
  push:
    tags:
      - 'v*'
    # Path filters apply only to the branch push; a tag push always runs.
    branches:
      - main
    paths:
      - 'js/core/constants.js'
  workflow_dispatch:

permissions:
  contents: write        # required to create the release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19 (GitHub's
    # notice on every run), and this job is only ever exercised by a real
    # release, so a runner change should be a deliberate edit, not a surprise.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # tools/build-portable.js uses fs.cpSync, which needs 16.7+. 24 is
          # what the tests are run on locally; 20 left support in 2026-04.
          node-version: '24'

      # The About box reads APP_VERSION. If the tag disagreed with it, the
      # release page and the running app would name different versions and
      # nobody could tell which build they had. Without a pushed tag (a push
      # to main, or Run workflow) the tag is v<APP_VERSION>, only ever from
      # main, and never one that already exists - so a constants.js edit
      # that is not a version bump cannot overwrite or duplicate a release.
      - name: Tag must match APP_VERSION
        run: |
          APP=$(node -p "require('./tools/build-portable.js').appVersion('.')")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "::error::Run the release from main, not $GITHUB_REF_NAME." >&2
              exit 1
            fi
            TAG="v$APP"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
                echo "::error::$TAG already exists. Bump APP_VERSION in js/core/constants.js first." >&2
                exit 1
              fi
              echo "::notice::$TAG is already released - this change did not bump APP_VERSION, so there is nothing to publish."
              echo "SKIP=true" >> "$GITHUB_ENV"
              exit 0
            fi
          fi
          echo "APP_VERSION=$APP  tag=$TAG"
          if [ "$APP" != "${TAG#v}" ]; then
            echo "::error::Tag $TAG does not match APP_VERSION $APP. Bump js/core/constants.js, or retag." >&2
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      # Zero dependencies and all Node built-ins, so this needs no install
      # step. Not the Playwright suite: it drives an INSTALLED Chrome
      # (channel: 'chrome'), which would drag npm into an otherwise
      # dependency-free job for a browser this runner has no reason to have.
      - name: Test
        if: env.SKIP != 'true'
        run: node tests/run-all.js

      - name: Build the portable folder
        if: env.SKIP != 'true'
        run: node tools/build-portable.js

      # Named after the version so two downloads cannot unzip over each other.
      - name: Package
        if: env.SKIP != 'true'
        run: |
          NAME="PixULA-${TAG#v}"
          cp -r PixULA_Distilled "$NAME"
          zip -r "$NAME.zip" "$NAME"
          echo "ASSET=$NAME.zip" >> "$GITHUB_ENV"
          unzip -l "$NAME.zip" | head -20

      # gh is already on the runner, so a zero-dependency project does not
      # take on a third-party action to publish. An alpha/beta/rc tag is
      # marked pre-release automatically. --target matters only when the tag
      # does not exist yet (a push to main, or Run workflow): gh creates it on
      # the commit this job built. A pushed tag already exists and is left as
      # it is.
      - name: Publish
        if: env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "$TAG" in
            *-alpha*|*-beta*|*-rc*) PRE="--prerelease" ;;
          esac
          gh release create "$TAG" "$ASSET" \
            --target "$GITHUB_SHA" \
            --title "PixULA $TAG" \
            --generate-notes \
            $PRE \
            --notes "Download **$ASSET**, unzip it anywhere, and double-click \`PixULA.html\`. It runs in your browser with no install, no server and no internet connection. Your work never leaves your machine.

          Built from \`$GITHUB_SHA\` by the release workflow, so this archive is exactly the tagged source."
