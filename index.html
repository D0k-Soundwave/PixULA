<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="PixULA - ZX Spectrum Pixel Art Editor">
    <title>PixULA</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='black'/><rect x='1' y='1' width='6' height='6' fill='blue'/><rect x='9' y='1' width='6' height='6' fill='red'/><rect x='1' y='9' width='6' height='6' fill='green'/><rect x='9' y='9' width='6' height='6' fill='yellow'/></svg>">

    <!-- Stylesheets: precedence is by @layer (declared in variables.css),
         not by link order. -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/utilities.css">
</head>
<body>
    <!-- Main application container -->
    <div id="app" role="application" aria-label="PixULA">

        <!-- Skip link (visible on keyboard focus) -->
        <a href="#canvas-area" class="skip-link" data-i18n="a11y.skipToCanvas">Skip to canvas</a>

        <!-- Header: menus (generated by MenuSystem) + app settings -->
        <header id="header" role="banner">
            <nav id="menu-bar" role="menubar" aria-label="Main menu">
                <!-- Menu items generated by MenuSystem from its definitions -->
            </nav>
            <div id="header-controls">
                <!-- Selectors wired by the AppSettings component -->
                <select id="language-selector" name="language" aria-label="Language">
                    <option value="en">English</option>
                    <option value="es">Español</option>
                    <option value="de">Deutsch</option>
                    <option value="fr">Français</option>
                    <option value="it">Italiano</option>
                    <option value="pt">Português</option>
                    <option value="pl">Polski</option>
                    <option value="cs">Čeština</option>
                    <option value="sk">Slovenčina</option>
                    <option value="hu">Magyar</option>
                    <option value="ro">Română</option>
                    <option value="tr">Türkçe</option>
                    <option value="ru">Русский</option>
                </select>
                <select id="font-scale-selector" name="font-scale" aria-label="Interface size" data-i18n-aria-label="a11y.textSize" title="Interface size">
                    <option value="0.85">85%</option>
                    <option value="1" selected>100%</option>
                    <option value="1.25">125%</option>
                    <option value="1.5">150%</option>
                    <option value="2">200%</option>
                </select>
                <!-- Border dropdown (BorderControl) — moved here from the
                     drawing-modes toolbar 2026-08-26; a plain select like its
                     header neighbours, not the captioned rail-style control it
                     used to be. -->
                <div id="border-host"></div>
            </div>
        </header>

        <!-- Top strip: draw modes, Mirror and Swap/Recolour. Spans the canvas
             column only (between the colour rail and the right panels),
             directly under the header. ColorBarFit (js/ui/components/
             colorbar-fit.js) guarantees this always renders as exactly ONE
             row, at every interface-size setting and window width — see its
             class comment. The palette swatches used to live here too; they
             moved to #color-rail 2026-08-25 (docs/superpowers/specs/
             2026-08-25-colour-rail-design.md); Border moved to the header
             2026-08-26 — ColorBarFit's search only ever has to fit this one
             group now. -->
        <div id="color-bar" role="toolbar" aria-label="Drawing modes" aria-orientation="horizontal">
            <div id="color-bar-controls">
                <!-- One caption for the whole icon-only run below (draw modes,
                     Mirror, Swap/Recolour), captioned the same way Ink/Paper
                     caption their swatch groups (css/components.css
                     _captionGroup) — text above, the row of controls below,
                     both centred as one column. -->
                <span id="marks-group-label" class="toolbar-group-label" data-i18n="dm.groupLabel">Drawing Modes</span>
                <div id="marks-icons-row">
                    <!-- Global draw-mode selector (DrawModeBar): icon buttons in
                         the left-toolbar style; drives StateManager's
                         document-wide mode. -->
                    <div id="draw-modes" class="toolbar-section"></div>
                    <!-- Mirror (symmetry drawing) toggles (DrawModeBar) — filed
                         next to the draw modes because it changes how every
                         stroke lands, exactly like they do. -->
                    <div id="mirror-modes" class="toolbar-section" role="group" aria-label="Mirror"></div>
                    <!-- Swap / Recolour (ClutBar) sit INLINE with the draw modes,
                         after XOR: one run, one pitch, no group gap between them. -->
                    <div id="attr-tools" class="toolbar-section clut-attrs"></div>
                </div>
            </div>
        </div>

        <!-- Left rail: current ink/paper preview (ClutBar) then tools (ToolRail) -->
        <aside id="toolbar" role="toolbar" aria-label="Tools" aria-orientation="vertical">
            <!-- Persistent Ink / Paper preview wells, populated by ClutBar. -->
            <div id="color-preview"></div>
            <!-- Tool buttons generated by ToolRail from TOOL_GROUPS -->
            <div id="tool-rail"></div>
        </aside>

        <!-- Central canvas area -->
        <main id="canvas-area" role="main" aria-label="Drawing canvas" tabindex="-1">
            <!-- Vertical colour rail: every screen mode's palette swatches
                 (ClutBar), floating over the left edge of the drawing area
                 as a CHILD of #canvas-area (css/layout.css: position:
                 relative on #canvas-area, position: absolute here) rather
                 than a grid column of its own — a fixed column here pushed
                 #panels off-screen on a narrow window, and gave the rail
                 no reliable way to stay confined to just this row without
                 also covering #color-bar above it. Swatches are a fixed
                 size — scales only with --ui-scale, no independent
                 auto-fit (contrast #color-bar, which ColorBarFit dials on
                 its own). Scrolls vertically for palettes taller than the
                 available height (the 256-entry Next grid, mainly); never
                 scrolls sideways. -->
            <aside id="color-rail" role="toolbar" aria-label="Colours" aria-orientation="vertical">
                <!-- Everything the rail shows, as one block so ColorRailToggle
                     (js/ui/components/colorrail-toggle.js) can hide all of it
                     with a single display:none when the rail is collapsed,
                     whatever ClutBar happens to have built for the active mode. -->
                <div id="color-rail-content">
                    <!-- Bright/Flash (ClutBar; per-mode, empty where the mode has
                         no attribute bits) and the GigaScreen sub-screen view
                         toggle — first in the rail, above the swatches. -->
                    <div id="colour-bits" class="toolbar-section"></div>
                    <div id="toolbar-color" class="toolbar-section">
                        <!-- Swatch cluster (ClutBar) is prepended here. -->
                    </div>
                </div>
                <!-- The rail's collapse/expand tab: a child of #color-rail now
                     that the rail is a floating overlay rather than a clipped
                     grid column — it pokes out past the rail's own right edge
                     (css/components.css .rail-collapse-tab: left: 100%) and
                     slides along with the rail when collapsed (css/layout.css),
                     landing back at the toolbar/canvas boundary either way. See
                     js/ui/components/colorrail-toggle.js for the toggle logic. -->
                <button id="color-rail-toggle" class="rail-collapse-tab" type="button"
                        aria-expanded="true" aria-controls="color-rail-content"
                        data-i18n-title-name="clut.railCollapse" data-i18n-title="clut.railToggleHint"
                        data-i18n-aria-label="clut.railCollapse"
                        title="Collapse colour rail" aria-label="Collapse colour rail"></button>
            </aside>
            <div id="canvas-viewport">
                <!-- Canvas iframe — isolated canvas environment. The 256×192
                     sizes below are STANDARD_ULA defaults; CanvasSystem owns
                     resizing them from the active SCREEN_MODES descriptor
                     (Phase 12+). -->
                <iframe id="canvas-frame" aria-label="Drawing canvas 256 by 192 pixels" srcdoc="
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <style>
                            * { margin: 0; padding: 0; box-sizing: border-box; }
                            html, body { width: 100%; height: 100%; background: transparent; }
                            body {
                                overflow: auto;
                                display: flex;
                                touch-action: none;
                                -webkit-user-select: none;
                                user-select: none;
                            }
                            #canvas-shell {
                                position: relative;
                                flex-shrink: 0;
                                flex-grow: 0;
                                margin: auto;
                            }
                            #canvas-container {
                                position: absolute;
                                transform-origin: top left;
                                width: 256px;
                                height: 192px;
                                z-index: 1;
                            }
                            /* grid-wrapper is sized to the picture in UNSCALED px
                               (canvas-container is the transform-scaled one), so its
                               outline is the picture's edge at a constant 1px on every
                               zoom. The outline sits just OUTSIDE the box, on the ZX
                               border colour, covering no artwork; --canvas-edge is
                               mirrored in from the parent theme by CanvasSystem. */
                            #grid-wrapper {
                                position: absolute;
                                pointer-events: none;
                                z-index: 2;
                                overflow: hidden;
                                outline: 1px solid var(--canvas-edge, transparent);
                            }
                            #canvas-container > canvas {
                                position: absolute;
                                top: 0;
                                left: 0;
                                width: 256px;
                                height: 192px;
                                image-rendering: pixelated;
                                image-rendering: crisp-edges;
                            }
                            #grid-wrapper > canvas {
                                position: absolute;
                                top: 0;
                                left: 0;
                                pointer-events: none;
                            }
                            /* Z-INDEX STRUCTURE:
                               canvas-container (z=1)
                                 10: reference-layer-canvas ('below', created dynamically by ReferenceLayerService)
                                 50: main-canvas
                                 100: function-preview-canvas
                                 150: composite-preview-canvas
                                 350: selection-canvas
                                 400: cursor-canvas (tool chrome that must stay
                                      legible ON TOP of what the tool previews:
                                      the bezier handles, GridOverlay.drawHandles)
                                 450: reference-layer-canvas ('above', created dynamically by ReferenceLayerService)
                               grid-wrapper (z=2, sub-pixel rendering)
                                 200: grid-1x1-canvas
                                 250: grid-8x8-canvas
                                 300: grid-16x16-canvas
                            */
                            /* main-canvas paper colour is set by CanvasSystem from the
                               active palette at init — never hardcoded here. */
                            /* No shadow/effect on the canvas: it would darken the
                               backdrop around it, and that backdrop IS the ZX border
                               colour — it must read as the exact palette colour. */
                            #main-canvas { z-index: 50; }
                            #function-preview-canvas { z-index: 100; pointer-events: none; }
                            #composite-preview-canvas { z-index: 150; pointer-events: none; }
                            #grid-1x1-canvas { z-index: 200; pointer-events: none; }
                            #grid-8x8-canvas { z-index: 250; pointer-events: none; }
                            #grid-16x16-canvas { z-index: 300; pointer-events: none; }
                            #selection-canvas { z-index: 350; pointer-events: none; }
                            #cursor-canvas { z-index: 400; pointer-events: none; }
                            #main-canvas:focus { outline: none; }
                        </style>
                    </head>
                    <body>
                        <div id='canvas-shell'>
                            <div id='canvas-container'>
                                <canvas id='main-canvas' width='256' height='192' tabindex='0'></canvas>
                                <canvas id='function-preview-canvas' width='256' height='192'></canvas>
                                <canvas id='composite-preview-canvas' width='256' height='192'></canvas>
                                <canvas id='selection-canvas' width='256' height='192'></canvas>
                                <canvas id='cursor-canvas' width='256' height='192'></canvas>
                                <canvas id='reference-canvas' width='256' height='192'></canvas>
                            </div>
                            <div id='grid-wrapper'>
                                <canvas id='grid-1x1-canvas'></canvas>
                                <canvas id='grid-8x8-canvas'></canvas>
                                <canvas id='grid-16x16-canvas'></canvas>
                            </div>
                        </div>
                        <script>
                            window.getCanvasElements = function() {
                                return {
                                    container: document.getElementById('canvas-container'),
                                    main: document.getElementById('main-canvas'),
                                    functionPreview: document.getElementById('function-preview-canvas'),
                                    compositePreview: document.getElementById('composite-preview-canvas'),
                                    grid1x1: document.getElementById('grid-1x1-canvas'),
                                    grid8x8: document.getElementById('grid-8x8-canvas'),
                                    grid16x16: document.getElementById('grid-16x16-canvas'),
                                    selection: document.getElementById('selection-canvas'),
                                    cursor: document.getElementById('cursor-canvas'),
                                    reference: document.getElementById('reference-canvas'),
                                    grid: document.getElementById('grid-8x8-canvas'),
                                    preview: document.getElementById('composite-preview-canvas')
                                };
                            };
                            window.setZoom = function(zoom) {
                                var s = zoom / 100;
                                var canvas = document.getElementById('main-canvas');
                                var scaledW = Math.round(canvas.width * s);
                                var scaledH = Math.round(canvas.height * s);
                                var container = document.getElementById('canvas-container');
                                if (container) container.style.transform = 'scale(' + s + ')';
                                var gw = document.getElementById('grid-wrapper');
                                if (gw) {
                                    gw.style.width  = scaledW + 'px';
                                    gw.style.height = scaledH + 'px';
                                }
                                // Give the body a content size matching the scaled canvas so the
                                // iframe can scroll when the scaled canvas exceeds the viewport.
                                document.body.style.minWidth  = scaledW + 'px';
                                document.body.style.minHeight = scaledH + 'px';
                            };
                            window.setPan = function(x, y) {
                                var container = document.getElementById('canvas-container');
                                if (container) { container.style.left = x + 'px'; container.style.top = y + 'px'; }
                            };
                        </script>
                    </body>
                    </html>
                "></iframe>
            </div>
            <!-- Zoom / grid / cursor strip — controls generated & wired by CanvasControls -->
            <div id="canvas-controls">
                <div id="zoom-controls" role="group" aria-label="Zoom controls"></div>
                <div id="grid-controls" role="group" aria-label="Grid controls"></div>
                <div id="canvas-info" aria-live="polite">
                    <span id="cursor-position"></span>
                    <span id="cell-position"></span>
                </div>
            </div>
        </main>

        <!-- Right sidebar: panels built from the tpl-panel template.
             DOM source order is the canonical order (Layers -> Tool Options ->
             Transform -> Reference); all panels stack and scroll together. -->
        <aside id="panels" role="complementary" aria-label="Panels"></aside>

        <!-- Status bar -->
        <footer id="status-bar" role="status" aria-live="polite">
            <span id="status-message" data-i18n="status.ready">Ready</span>
            <!-- Shown by DrawModeBar ONLY while the global draw mode is not
                 Normal: in Paper Recolour or Attributes Only a stroke can leave
                 no visible mark, and the artist must be able to see why without
                 hunting for the selector. -->
            <span id="draw-mode-status" hidden></span>
            <!-- The touch drawing switch (TouchModeStatus). A button, not a
                 readout: it is the one touch setting changed mid-drawing, and
                 it always says which state it is in rather than only the
                 unusual one. Hidden on hardware that cannot be touched. -->
            <button type="button" id="touch-mode-status" class="status-toggle" hidden></button>
            <span id="canvas-size"></span>
        </footer>

        <!-- Visually-hidden live region for assistive-tech announcements -->
        <div id="a11y-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

    </div>

    <!-- Panel chrome template — the ONE source of panel markup.
         PanelSection stamps this for every sidebar section. -->
    <template id="tpl-panel">
        <section class="panel">
            <header class="panel-header">
                <h2 class="panel-title"></h2>
                <button type="button" class="panel-collapse" aria-expanded="true" data-i18n-title-name="panel.collapse" data-i18n-title="panel.collapseExpand.hint" title="Collapse/expand — Collapses this panel to its title bar, or expands it back">
                    <span class="sr-only" data-i18n="panel.collapse">Collapse</span>
                </button>
            </header>
            <div class="panel-content"></div>
        </section>
    </template>

    <!-- SVG icon sprite — the ONE icon system (tool rail, layer/stamp rows, menus). -->
    <svg xmlns="http://www.w3.org/2000/svg" class="svg-sprite" aria-hidden="true">
        <!-- Tools -->
        <symbol id="icon-brush" viewBox="0 0 24 24"><path d="M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3zm13.71-9.37l-1.34-1.34a.996.996 0 00-1.41 0L9 12.25 11.75 15l8.96-8.96a.996.996 0 000-1.41z"/></symbol>
        <symbol id="icon-eraser" viewBox="0 0 24 24"><path d="M16.24 3.56l4.95 4.94c.78.79.78 2.05 0 2.84L12 20.53a4.008 4.008 0 01-5.66 0L2.81 17c-.78-.79-.78-2.05 0-2.84l10.6-10.6c.79-.78 2.05-.78 2.83 0z"/></symbol>
        <symbol id="icon-fill" viewBox="0 0 24 24"><path d="M16.56 8.94L7.62 0 6.21 1.41l2.38 2.38-5.15 5.15c-.59.59-.59 1.54 0 2.12l5.5 5.5c.29.29.68.44 1.06.44s.77-.15 1.06-.44l5.5-5.5c.59-.58.59-1.53 0-2.12zM5.21 10L10 5.21 14.79 10H5.21zM19 11.5s-2 2.17-2 3.5c0 1.1.9 2 2 2s2-.9 2-2c0-1.33-2-3.5-2-3.5z"/></symbol>
        <symbol id="icon-spray" viewBox="0 0 24 24"><circle cx="12" cy="8" r="1"/><circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="8" cy="9" r="1"/><circle cx="16" cy="9" r="1"/><circle cx="11" cy="11" r="1"/><circle cx="13" cy="11" r="1"/><path d="M12 14c-3 0-5 2-5 4v4h10v-4c0-2-2-4-5-4z"/></symbol>
        <symbol id="icon-hatch" viewBox="0 0 24 24"><path d="M3 9L9 3M3 15L15 3M7 19L19 7M11 21L21 11M17 21L21 17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
        <symbol id="icon-fade" viewBox="0 0 24 24"><rect x="2" y="6" width="6" height="12" fill="currentColor"/><g fill="currentColor"><circle cx="10.5" cy="7" r="1"/><circle cx="10.5" cy="10" r="1"/><circle cx="10.5" cy="13" r="1"/><circle cx="10.5" cy="16" r="1"/><circle cx="13.5" cy="8.5" r="1"/><circle cx="13.5" cy="12" r="1"/><circle cx="13.5" cy="15.5" r="1"/><circle cx="16.5" cy="8" r="1"/><circle cx="16.5" cy="13" r="1"/><circle cx="19.5" cy="11" r="1"/></g></symbol>
        <!-- Eyedropper: a proper bulb pipette (round bulb, collar, tapered
             stem, a drop at the tip) tilted to the diagonal every other
             hand tool in this sprite (brush, hatch) already draws at. -->
        <symbol id="icon-eyedropper" viewBox="0 0 24 24"><g transform="rotate(40 12 12)" fill="currentColor"><ellipse cx="12" cy="5.2" rx="4.6" ry="4.2"/><rect x="10.3" y="9" width="3.4" height="1.6"/><path d="M9.7 10.6 L14.3 10.6 L12 20.2 Z"/><circle cx="12" cy="22.2" r="1.3"/></g></symbol>
        <symbol id="icon-shapes" viewBox="0 0 24 24"><rect x="2" y="10" width="10" height="10" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="16" cy="8" r="6" stroke="currentColor" stroke-width="2" fill="none"/></symbol>
        <symbol id="icon-bezier" viewBox="0 0 24 24"><path d="M4 19C7 8 17 8 20 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="2" y="17" width="4" height="4" fill="currentColor"/><rect x="18" y="17" width="4" height="4" fill="currentColor"/><circle cx="12" cy="6" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 8v2.5" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="1.5 1.5"/></symbol>
        <symbol id="icon-gradient" viewBox="0 0 24 24"><rect x="3" y="3" width="3" height="18" fill="currentColor" opacity="1"/><rect x="6" y="3" width="3" height="18" fill="currentColor" opacity="0.8"/><rect x="9" y="3" width="3" height="18" fill="currentColor" opacity="0.6"/><rect x="12" y="3" width="3" height="18" fill="currentColor" opacity="0.4"/><rect x="15" y="3" width="3" height="18" fill="currentColor" opacity="0.2"/><rect x="18" y="3" width="3" height="18" fill="currentColor" opacity="0.05"/></symbol>
        <symbol id="icon-selection" viewBox="0 0 24 24"><path d="M3 5h2v2H3V5zm0 4h2v2H3V9zm0 4h2v2H3v-2zm0 4h2v2H3v-2zm4-12h2v2H7V5zm4 0h2v2h-2V5zm4 0h2v2h-2V5zm4 0h2v2h-2V5zm0 4h2v2h-2V9zm0 4h2v2h-2v-2zm0 4h2v2h-2v-2zm-4 0h2v2h-2v-2zm-4 0h2v2h-2v-2zm-4 0h2v2H7v-2z"/></symbol>
        <symbol id="icon-select-ellipse" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="3 2.5"/><path d="M12 10.5v3M10.5 12h3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
        <symbol id="icon-select-lasso"viewBox="0 0 24 24"><path d="M12 4c4.4 0 8 2.5 8 5.5 0 2.4-2.3 4.5-5.6 5.2-1.2.3-2 .8-2 1.6 0 .6.4 1 .4 1.7 0 1.1-.9 2-2 2s-2-.9-2-2c0-1.5 1.1-2.2 2.2-2.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M12 4C7.6 4 4 6.5 4 9.5c0 1.6 1 3 2.7 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
        <symbol id="icon-guide-in" viewBox="0 0 24 24"><path d="M3 3h18v18H3z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="3 2" opacity="0.8"/><path d="M6 12L12 6M6 17L17 6M11 18L18 11M16 18L18 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
        <symbol id="icon-guide-out" viewBox="0 0 24 24"><path d="M7 7h10v10H7z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="3 2" opacity="0.8"/><path d="M2 6L6 2M2 12L6 8M2 18L6 14M18 22L22 18M18 16L22 12M18 10L22 6M9 3L11 1M13 3L15 1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
        <symbol id="icon-select-cell" viewBox="0 0 24 24"><path d="M3 3h18v18H3V3zm0 6h18M3 15h18M9 3v18M15 3v18" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="9" width="6" height="6" fill="currentColor" opacity="0.85"/></symbol>
        <symbol id="icon-move" viewBox="0 0 24 24"><path d="M10 9h4V6h3l-5-5-5 5h3v3zm-1 1H6V7l-5 5 5 5v-3h3v-4zm14 2l-5-5v3h-3v4h3v3l5-5zm-9 3h-4v3H7l5 5 5-5h-3v-3z"/></symbol>
        <!-- The four quadrants of icon-move, split into their own symbols so
             the .dir-pad control (Transform panel Shift, Reference panel
             Offset) can show each direction outlined at rest and filled on
             hover/focus of that direction's own zone - the coordinates are

             the 24x24 box. Every glyph below therefore fills an 18-unit ink box
             centred on 12,12 (its LONG axis measures 18) and strokes at 1.6, so
             the row reads at one weight. Keep any icon added here to that rule. -->

        <!-- The pencil is drawn with arcs, so it meets the 18-unit rule by a

        <!-- XOR / Over: two overlapping squares drawn as ONE path with
