<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="PixULA - ZX Spectrum Pixel Art Editor">
    <title>PixULA</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='black'/><rect x='1' y='1' width='6' height='6' fill='blue'/><rect x='9' y='1' width='6' height='6' fill='red'/><rect x='1' y='9' width='6' height='6' fill='green'/><rect x='9' y='9' width='6' height='6' fill='yellow'/></svg>">

    <!-- Stylesheets: precedence is by @layer (declared in variables.css),
         not by link order. -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/utilities.css">
</head>
<body>
    <!-- Main application container -->
    <div id="app" role="application" aria-label="PixULA">

        <!-- Skip link (visible on keyboard focus) -->
        <a href="#canvas-area" class="skip-link" data-i18n="a11y.skipToCanvas">Skip to canvas</a>

        <!-- Header: menus (generated by MenuSystem) + app settings -->
        <header id="header" role="banner">
            <nav id="menu-bar" role="menubar" aria-label="Main menu">
                <!-- Menu items generated by MenuSystem from its definitions -->
            </nav>
            <div id="header-controls">
                <!-- Selectors wired by the AppSettings component -->
                <select id="language-selector" name="language" aria-label="Language">
                    <option value="en">English</option>
                    <option value="es">Español</option>
                    <option value="de">Deutsch</option>
                    <option value="fr">Français</option>
                    <option value="it">Italiano</option>
                    <option value="pt">Português</option>
                    <option value="pl">Polski</option>
                    <option value="cs">Čeština</option>
                    <option value="sk">Slovenčina</option>
                    <option value="hu">Magyar</option>
                    <option value="ro">Română</option>
                    <option value="tr">Türkçe</option>
                    <option value="ru">Русский</option>
                </select>
                <select id="theme-selector" name="theme" aria-label="Theme">
                    <option value="dark" data-i18n="theme.dark">Dark</option>
                    <option value="light" data-i18n="theme.light">Light</option>
                    <option value="midnight" data-i18n="theme.midnight">Midnight</option>
                    <option value="nord" data-i18n="theme.nord">Nord</option>
                    <option value="dracula" data-i18n="theme.dracula">Dracula</option>
                    <option value="sepia" data-i18n="theme.sepia">Sepia</option>
                </select>
                <select id="font-scale-selector" name="font-scale" aria-label="Interface size" data-i18n-aria-label="a11y.textSize" title="Interface size">
                    <option value="0.85">85%</option>
                    <option value="1" selected>100%</option>
                    <option value="1.25">125%</option>
                    <option value="1.5">150%</option>
                    <option value="2">200%</option>
                </select>
                <label class="header-tts" title="Speak UI changes aloud" data-i18n-title="a11y.speakHint">
                    <input type="checkbox" id="tts-toggle">
                    <span data-i18n="a11y.speak">Speak</span>
                </label>
            </div>
        </header>

        <!-- Top colour bar: the full palette / CLUTs for the active screen
             mode plus the attribute paint ops. Spans the canvas column
             between the two rails, under the header, and is optimised for
             pen/touch (large hit targets). Swatches generated by ClutBar
             from ColorManager's palette; attribute op buttons generated by
             ClutBar; Border dropdown appended by BorderControl. Zero
             hand-written swatches. -->
        <div id="color-bar" role="toolbar" aria-label="Colours and attributes" aria-orientation="horizontal">
            <!-- Three groups, cut by what the control DOES to the picture, at
                 one shared pitch (one palette-icon block) between every pair:
                 PALETTE: the swatches and the selectors that say which
                 swatches (ULAplus CLUT, GigaScreen view, Timex scheme).
                 ATTRS: the Bright/Flash bits and the Border — cell/screen
                 attributes, not swatches, but riding right after the
                 palette rather than with the marks. MARKS: how a stroke
                 combines with what is already there — the draw modes, with
                 Swap and Recolour after them because they are attribute ops,
                 not colours.
                 They are three SEPARATE flex items (not #toolbar-attrs
                 nested inside the palette group, tried 2026-08-10 and
                 reverted) specifically so ordinary flex-wrap packs them
                 freely: whichever group runs out of room drops to the next
                 line and picks up whatever follows it that still fits there
                 too — e.g. attrs joins the marks row rather than claiming a
                 whole line of its own — which is what keeps the bar at TWO
                 rows across a much wider range of interface-size settings
                 than a rigid "each group is its own line" rule would. -->
            <div id="toolbar-color" class="toolbar-section">
                <!-- Swatch cluster (ClutBar) is prepended here. -->
            </div>
            <div id="toolbar-attrs" class="toolbar-section">
                <!-- Bright/Flash (ClutBar; per-mode, empty where the mode has
                     no attribute bits) -->
                <div id="colour-bits" class="toolbar-section"></div>
                <!-- Border dropdown (BorderControl) -->
                <div id="border-host" class="toolbar-section"></div>
            </div>
            <div id="color-bar-controls">
                <!-- Global draw-mode selector (DrawModeBar): icon buttons in the
                     left-toolbar style; drives StateManager's document-wide mode. -->
                <div id="draw-modes" class="toolbar-section"></div>
                <!-- Swap / Recolour (ClutBar) sit INLINE with the draw modes,
                     after XOR: one run, one pitch, no group gap between them. -->
                <div id="attr-tools" class="toolbar-section clut-attrs"></div>
            </div>
        </div>

        <!-- Left rail: current ink/paper preview (ClutBar) then tools (ToolRail) -->
        <aside id="toolbar" role="toolbar" aria-label="Tools" aria-orientation="vertical">
            <!-- Persistent Ink / Paper preview wells, populated by ClutBar. -->
            <div id="color-preview"></div>
            <!-- Tool buttons generated by ToolRail from TOOL_GROUPS -->
            <div id="tool-rail"></div>
        </aside>

        <!-- Central canvas area -->
        <main id="canvas-area" role="main" aria-label="Drawing canvas" tabindex="-1">
            <div id="canvas-viewport">
                <!-- Canvas iframe — isolated canvas environment. The 256×192
                     sizes below are STANDARD_ULA defaults; CanvasSystem owns
                     resizing them from the active SCREEN_MODES descriptor
                     (Phase 12+). -->
                <iframe id="canvas-frame" aria-label="Drawing canvas 256 by 192 pixels" srcdoc="
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <style>
                            * { margin: 0; padding: 0; box-sizing: border-box; }
                            html, body { width: 100%; height: 100%; background: transparent; }
                            body {
                                overflow: auto;
                                display: flex;
                                touch-action: none;
                                -webkit-user-select: none;
                                user-select: none;
                            }
                            #canvas-shell {
                                position: relative;
                                flex-shrink: 0;
                                flex-grow: 0;
                                margin: auto;
                            }
                            #canvas-container {
                                position: absolute;
                                transform-origin: top left;
                                width: 256px;
                                height: 192px;
                                z-index: 1;
                            }
                            /* grid-wrapper is sized to the picture in UNSCALED px
                               (canvas-container is the transform-scaled one), so its
                               outline is the picture's edge at a constant 1px on every
                               zoom. The outline sits just OUTSIDE the box, on the ZX
                               border colour, covering no artwork; --canvas-edge is
                               mirrored in from the parent theme by CanvasSystem. */
                            #grid-wrapper {
                                position: absolute;
                                pointer-events: none;
                                z-index: 2;
                                overflow: hidden;
                                outline: 1px solid var(--canvas-edge, transparent);
                            }
                            #canvas-container > canvas {
                                position: absolute;
                                top: 0;
                                left: 0;
                                width: 256px;
                                height: 192px;
                                image-rendering: pixelated;
                                image-rendering: crisp-edges;
                            }
                            #grid-wrapper > canvas {
                                position: absolute;
                                top: 0;
                                left: 0;
                                pointer-events: none;
                            }
                            /* Z-INDEX STRUCTURE:
                               canvas-container (z=1)
                                 10: reference-layer-canvas ('below', created dynamically by ReferenceLayerService)
                                 50: main-canvas
                                 100: function-preview-canvas
                                 150: composite-preview-canvas
                                 350: selection-canvas
                                 400: cursor-canvas (tool chrome that must stay
                                      legible ON TOP of what the tool previews:
                                      the bezier handles, GridOverlay.drawHandles)
                                 450: reference-layer-canvas ('above', created dynamically by ReferenceLayerService)
                               grid-wrapper (z=2, sub-pixel rendering)
                                 200: grid-1x1-canvas
                                 250: grid-8x8-canvas
                                 300: grid-16x16-canvas
                            */
                            /* main-canvas paper colour is set by CanvasSystem from the
                               active palette at init — never hardcoded here. */
                            /* No shadow/effect on the canvas: it would darken the
                               backdrop around it, and that backdrop IS the ZX border
                               colour — it must read as the exact palette colour. */
                            #main-canvas { z-index: 50; }
                            #function-preview-canvas { z-index: 100; pointer-events: none; }
                            #composite-preview-canvas { z-index: 150; pointer-events: none; }
                            #grid-1x1-canvas { z-index: 200; pointer-events: none; }
                            #grid-8x8-canvas { z-index: 250; pointer-events: none; }
                            #grid-16x16-canvas { z-index: 300; pointer-events: none; }
                            #selection-canvas { z-index: 350; pointer-events: none; }
                            #cursor-canvas { z-index: 400; pointer-events: none; }
                            #main-canvas:focus { outline: none; }
                        </style>
                    </head>
                    <body>
                        <div id='canvas-shell'>
                            <div id='canvas-container'>
                                <canvas id='main-canvas' width='256' height='192' tabindex='0'></canvas>
                                <canvas id='function-preview-canvas' width='256' height='192'></canvas>
                                <canvas id='composite-preview-canvas' width='256' height='192'></canvas>
                                <canvas id='selection-canvas' width='256' height='192'></canvas>
                                <canvas id='cursor-canvas' width='256' height='192'></canvas>
                                <canvas id='reference-canvas' width='256' height='192'></canvas>
                            </div>
                            <div id='grid-wrapper'>
                                <canvas id='grid-1x1-canvas'></canvas>
                                <canvas id='grid-8x8-canvas'></canvas>
                                <canvas id='grid-16x16-canvas'></canvas>
                            </div>
                        </div>
                        <script>
                            window.getCanvasElements = function() {
                                return {
                                    container: document.getElementById('canvas-container'),
                                    main: document.getElementById('main-canvas'),
                                    functionPreview: document.getElementById('function-preview-canvas'),
                                    compositePreview: document.getElementById('composite-preview-canvas'),
                                    grid1x1: document.getElementById('grid-1x1-canvas'),
                                    grid8x8: document.getElementById('grid-8x8-canvas'),
                                    grid16x16: document.getElementById('grid-16x16-canvas'),
                                    selection: document.getElementById('selection-canvas'),
                                    cursor: document.getElementById('cursor-canvas'),
                                    reference: document.getElementById('reference-canvas'),
                                    grid: document.getElementById('grid-8x8-canvas'),
                                    preview: document.getElementById('composite-preview-canvas')
                                };
                            };
                            window.setZoom = function(zoom) {
                                var s = zoom / 100;
                                var canvas = document.getElementById('main-canvas');
                                var scaledW = Math.round(canvas.width * s);
                                var scaledH = Math.round(canvas.height * s);
                                var container = document.getElementById('canvas-container');
                                if (container) container.style.transform = 'scale(' + s + ')';
                                var gw = document.getElementById('grid-wrapper');
                                if (gw) {
                                    gw.style.width  = scaledW + 'px';
                                    gw.style.height = scaledH + 'px';
                                }
                                // Give the body a content size matching the scaled canvas so the
                                // iframe can scroll when the scaled canvas exceeds the viewport.
                                document.body.style.minWidth  = scaledW + 'px';
                                document.body.style.minHeight = scaledH + 'px';
                            };
                            window.setPan = function(x, y) {
                                var container = document.getElementById('canvas-container');
                                if (container) { container.style.left = x + 'px'; container.style.top = y + 'px'; }
                            };
                        </script>
                    </body>
                    </html>
                "></iframe>
            </div>
            <!-- Zoom / grid / cursor strip — controls generated & wired by CanvasControls -->
            <div id="canvas-controls">
                <div id="zoom-controls" role="group" aria-label="Zoom controls"></div>
                <div id="grid-controls" role="group" aria-label="Grid controls"></div>
                <div id="canvas-info" aria-live="polite">
                    <span id="cursor-position"></span>
                    <span id="cell-position"></span>
                </div>
            </div>
        </main>

        <!-- Right sidebar: panels built from the tpl-panel template.
             DOM source order is the canonical order (Layers -> Tool Options ->
             Transform -> Reference); all panels stack and scroll together. -->
        <aside id="panels" role="complementary" aria-label="Panels"></aside>

        <!-- Status bar -->
        <footer id="status-bar" role="status" aria-live="polite">
            <span id="status-message" data-i18n="status.ready">Ready</span>
            <!-- Shown by DrawModeBar ONLY while the global draw mode is not
                 Normal: in Paper Recolour or Attributes Only a stroke can leave
                 no visible mark, and the artist must be able to see why without
                 hunting for the selector. -->
            <span id="draw-mode-status" hidden></span>
            <!-- The touch drawing switch (TouchModeStatus). A button, not a
                 readout: it is the one touch setting changed mid-drawing, and
                 it always says which state it is in rather than only the
                 unusual one. Hidden on hardware that cannot be touched. -->
            <button type="button" id="touch-mode-status" class="status-toggle" hidden></button>
            <span id="canvas-size"></span>
        </footer>

        <!-- Visually-hidden live region for assistive-tech announcements -->
        <div id="a11y-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

    </div>

    <!-- Panel chrome template — the ONE source of panel markup.
         PanelSection stamps this for every sidebar section. -->
    <template id="tpl-panel">
        <section class="panel">
            <header class="panel-header">
                <h2 class="panel-title"></h2>
                <button type="button" class="panel-collapse" aria-expanded="true" data-i18n-title="panel.collapseExpand" title="Collapse/expand">
                    <span class="sr-only" data-i18n="panel.collapse">Collapse</span>
                </button>
            </header>
            <div class="panel-content"></div>
        </section>
    </template>

             the 24x24 box. Every glyph below therefore fills an 18-unit ink box
